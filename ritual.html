<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>의식 안내 | 오늘의 부적</title>
  <meta name="description" content="의식별 절차, 비용, 준비하실 것을 안내합니다.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
  <script src="assets/theme.js"></script>
  <link rel="stylesheet" href="assets/common.css">
</head>
<body class="grain font-sans break-keep-all selection:bg-cinnabar/40">

  <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="orb absolute -top-40 -right-32 w-[40rem] h-[40rem] rounded-full" style="background: radial-gradient(circle, rgba(200,85,61,0.12), transparent 65%);"></div>
  </div>

  <div data-shell="header"></div>

  <main id="page">
    <!-- 상단: 제목 + 핵심 정보 -->
    <section id="top" class="relative pt-28 md:pt-36 pb-20 md:pb-28 overflow-hidden">
      <span id="rtMarkBig" aria-hidden="true" class="absolute -right-8 md:right-8 top-16 font-serif font-extrabold text-[14rem] md:text-[22rem] leading-none text-edge/[0.04] select-none"></span>
      <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <nav aria-label="현재 위치" class="reveal flex items-center gap-1.5 text-sm text-subtle">
          <a href="index.html" class="ease-spring hover:text-fg">홈</a>
          <iconify-icon icon="solar:alt-arrow-right-linear" width="14"></iconify-icon>
          <a href="index.html#services" class="ease-spring hover:text-fg">의식 안내</a>
          <iconify-icon icon="solar:alt-arrow-right-linear" width="14"></iconify-icon>
          <span id="rtCrumb" class="text-fg2"></span>
        </nav>

        <div class="mt-10 grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-10 items-end">
          <div class="lg:col-span-7">
            <span id="rtEyebrow" class="reveal inline-flex items-center gap-2 rounded-full px-3 py-1 text-[11px] tracking-[0.15em] font-medium bg-cinnabar/10 text-cinnabar-soft" style="--index:1"></span>
            <h1 id="rtTitle" class="reveal mt-5 text-4xl md:text-5xl lg:text-6xl font-bold tracking-tight leading-tight" style="--index:1"></h1>
            <p id="rtSummary" class="reveal mt-6 text-base md:text-lg text-muted leading-relaxed max-w-[52ch]" style="--index:2"></p>
            <div id="rtCta" class="reveal mt-10 flex flex-col sm:flex-row gap-3" style="--index:3"></div>
          </div>
          <aside class="lg:col-span-5">
            <div class="reveal rounded-[2rem] p-1.5 bg-edge/5 ring-1 ring-edge/10" style="--index:3">
              <dl id="rtFacts" class="rounded-[calc(2rem-0.375rem)] bg-surface shadow-[inset_0_1px_1px_rgba(255,255,255,0.08)] p-6 md:p-8 grid grid-cols-2 gap-x-6 gap-y-6"></dl>
            </div>
          </aside>
        </div>
      </div>
    </section>

    <!-- 대표 사진 -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-6 mb-20 md:mb-28">
      <div id="rtHeroImg" class="reveal relative h-56 md:h-[22rem] rounded-[2rem] overflow-hidden ring-1 ring-edge/10"></div>
    </div>

    <!-- 이런 분께 -->
    <section class="py-20 md:py-28 bg-deep/40 border-y border-edge/5">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-12 gap-10">
        <div class="lg:col-span-4">
          <span class="reveal inline-block rounded-full px-3 py-1 text-[11px] tracking-[0.15em] font-medium bg-cinnabar/10 text-cinnabar-soft">爲 · 이런 분께</span>
          <h2 class="reveal mt-5 text-3xl md:text-4xl font-bold tracking-tight leading-snug" style="--index:1">이럴 때<br>많이 모십니다</h2>
        </div>
        <ul id="rtForWhom" class="lg:col-span-8 grid grid-cols-1 sm:grid-cols-2 gap-3"></ul>
      </div>
    </section>

    <!-- 진행 순서 -->
    <section class="py-24 md:py-32">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-12 gap-12">
        <div class="lg:col-span-4">
          <div class="lg:sticky lg:top-32">
            <span class="reveal inline-block rounded-full px-3 py-1 text-[11px] tracking-[0.15em] font-medium bg-cinnabar/10 text-cinnabar-soft">順 · 진행 순서</span>
            <h2 class="reveal mt-5 text-3xl md:text-4xl font-bold tracking-tight leading-snug" style="--index:1">이렇게<br>진행됩니다</h2>
            <p class="reveal mt-5 text-sm text-subtle leading-relaxed" style="--index:2">세부 절차와 용어는 사찰마다 조금씩 다를 수 있습니다. 예약하시면 스님이 직접 설명해 드립니다.</p>
          </div>
        </div>
        <ol id="rtSteps" class="lg:col-span-8 relative"></ol>
      </div>
    </section>

    <!-- 비용 · 종류 -->
    <section id="price" class="py-24 md:py-32 bg-deep/40 border-y border-edge/5">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <span class="reveal inline-block rounded-full px-3 py-1 text-[11px] tracking-[0.15em] font-medium bg-cinnabar/10 text-cinnabar-soft" id="rtPriceEyebrow"></span>
        <h2 id="rtPriceTitle" class="reveal mt-5 text-3xl md:text-4xl font-bold tracking-tight leading-snug" style="--index:1"></h2>
        <div id="rtPrice" class="mt-12"></div>
      </div>
    </section>

    <!-- 준비하실 것 -->
    <section class="py-24 md:py-32">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div id="rtPrepareWrap" class="grid grid-cols-1 lg:grid-cols-2 gap-5"></div>
      </div>
    </section>

    <!-- 모시는 스님 -->
    <section id="monks" class="py-24 md:py-32 bg-deep/40 border-y border-edge/5 scroll-mt-24">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <span class="reveal inline-block rounded-full px-3 py-1 text-[11px] tracking-[0.15em] font-medium bg-cinnabar/10 text-cinnabar-soft">僧 · 모시는 스님</span>
        <h2 id="rtMonkTitle" class="reveal mt-5 text-3xl md:text-4xl font-bold tracking-tight leading-snug" style="--index:1"></h2>
        <div id="rtMonks" class="mt-12 grid gap-5"></div>
      </div>
    </section>

    <!-- 질문 -->
    <section id="faq" class="py-24 md:py-32">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-12 gap-12">
        <div class="lg:col-span-4">
          <span class="reveal inline-block rounded-full px-3 py-1 text-[11px] tracking-[0.15em] font-medium bg-cinnabar/10 text-cinnabar-soft">問 · 자주 묻는 질문</span>
          <h2 id="rtFaqTitle" class="reveal mt-5 text-3xl md:text-4xl font-bold tracking-tight leading-snug" style="--index:1"></h2>
          <a href="help.html" class="reveal ease-spring mt-6 inline-flex items-center gap-1 text-sm text-cinnabar-soft hover:gap-2" style="--index:2">고객센터에서 더 보기 <iconify-icon icon="solar:arrow-right-linear" width="14"></iconify-icon></a>
        </div>
        <div id="rtFaq" class="lg:col-span-8 divide-y divide-edge/10 border-y border-edge/10"></div>
      </div>
    </section>

    <!-- 다른 의식 -->
    <section class="pb-24 md:pb-32">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-end justify-between gap-6">
          <h2 class="reveal text-2xl md:text-3xl font-bold tracking-tight">다른 의식도 살펴보세요</h2>
          <a href="index.html#services" class="reveal ease-spring text-sm text-muted hover:text-fg flex items-center gap-1 shrink-0">전체 보기<iconify-icon icon="solar:alt-arrow-right-linear" width="16"></iconify-icon></a>
        </div>
        <div id="rtOthers" class="mt-8 flex gap-4 overflow-x-auto no-scrollbar -mx-4 px-4 lg:mx-0 lg:px-0 snap-x"></div>
      </div>
    </section>
  </main>

  <!-- 안내하지 않는 의식 -->
  <main id="notFound" class="hidden min-h-[100dvh] items-center justify-center px-4">
    <div class="text-center">
      <span class="font-serif text-7xl font-extrabold text-edge/10">無</span>
      <h1 class="mt-6 text-2xl font-bold">지금은 안내하지 않는 의식입니다</h1>
      <p class="mt-3 text-subtle">모실 수 있는 의식 목록에서 다시 골라 주세요.</p>
      <a href="index.html#services" class="ease-spring mt-8 inline-flex h-12 px-6 rounded-full bg-cinnabar text-white font-semibold items-center gap-2 hover:scale-[1.02]">의식 안내로<iconify-icon icon="solar:arrow-right-linear" width="18"></iconify-icon></a>
    </div>
  </main>

  <div data-shell="footer"></div>

  <!-- 모바일 하단 고정 바 -->
  <div id="stickyBar" class="md:hidden fixed bottom-0 inset-x-0 z-40 px-4 pb-4 translate-y-full opacity-0 ease-spring">
    <div id="stickyInner" class="flex gap-2 rounded-full p-1.5 bg-deep/80 backdrop-blur-xl border border-edge/10"></div>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/common.js"></script>
  <script>
    const { D, $, $$, won, manwon, esc, monkUrl, monkAvatar, landscapeSVG, charmSVG, stars } = YW;
    YW.mountShell({ active: 'ritual' });

    const key = new URLSearchParams(location.search).get('id');
    const r = YW.ritualInfo(key);
    const showSoon = YW.devOpt('emptyRitual') === 'soon';

    if (!r || (!r.active && !showSoon)) {
      $('#page').remove(); $('#stickyBar').remove();
      $('#notFound').classList.remove('hidden'); $('#notFound').classList.add('flex');
    } else if (YW.devOpt('ritualLayout') === 'guide') {
      renderGuide();
    } else {
      render();
    }

    // ================= 안내서형: 왼쪽에서 읽고, 오른쪽 상자에서 결정 =================
    function renderGuide() {
      const isCharm = r.key === 'charm';
      document.title = `${r.name} 안내 · 의미와 절차 | 오늘의 부적`;
      document.querySelector('meta[name=description]').setAttribute('content', `${r.summary} ${r.name}의 의미와 절차, 준비하실 것을 안내합니다.`);
      $('.orb')?.parentElement.remove(); // 배경 빛 번짐은 읽는 페이지에선 뺌

      // 이 페이지는 의식 '설명'만. 가격은 스님 페이지(가게)에서 안내하므로 금액을 보여 주지 않음
      const single = r.by.length === 1;
      const primaryLabel = isCharm ? '부적 고르러 가기' : '날짜 잡고 예약하기';
      const primaryHref = single ? YW.bookUrl(r.by[0], r.key) : '#g-monks';
      const monkHref = single ? monkUrl(r.by[0].id) : '#g-monks';
      const modeText = isCharm ? '등기 발송' : (r.modes || []).map(m => D.MODES[m].name).join(' · ');

      // 핵심 정보 4개 (맨 위 한 줄)
      const facts = [
        ['모시는 때', r.when, 'solar:calendar-linear'],
        [isCharm ? '받아 보시는 때' : '소요 시간', r.dur, 'solar:clock-circle-linear'],
        [isCharm ? '보내는 방법' : '횟수', r.count, isCharm ? 'solar:box-linear' : 'solar:repeat-linear'],
        [isCharm ? '제작 방식' : '참여 방식', isCharm ? D.MATERIALS.map(m => m.name).join(' · ') : modeText, isCharm ? 'solar:pen-linear' : 'solar:users-group-rounded-linear'],
      ];

      // 섹션 (탭과 같은 순서)
      const sections = [
        ['g-meaning', '의미'],
        ['g-about', '이런 분께'],
        ['g-steps', isCharm ? '만드는 순서' : '진행 순서'],
        ['g-ways', isCharm ? '부적 종류' : '모시는 방식'],
        ['g-prepare', isCharm ? '준비 · 보관' : '준비하실 것'],
        ['g-monks', '모시는 스님'],
        ['g-faq', '자주 묻는 질문'],
      ];
      const sec = (id, title, body, note = '') => `
        <section id="${id}" class="g-sec py-10 md:py-12 border-t border-edge/10 first:border-t-0 first:pt-2 scroll-mt-40">
          <h2 class="text-xl md:text-2xl font-bold tracking-tight">${title}</h2>
          ${note ? `<p class="mt-2 text-sm text-subtle leading-relaxed">${note}</p>` : ''}
          <div class="mt-6">${body}</div>
        </section>`;
      const checks = (items, icon = 'solar:check-circle-linear') => `<ul class="space-y-3">${items.map(t => `<li class="flex gap-3 text-base text-fg2 leading-relaxed"><iconify-icon icon="${icon}" width="20" class="text-cinnabar shrink-0 mt-[3px]"></iconify-icon><span>${t}</span></li>`).join('')}</ul>`;
      // 이름 + 설명 목록 (금액 없이)
      const defs = rows => `<dl class="rounded-2xl ring-1 ring-edge/10 divide-y divide-edge/10">${rows.map(([a, b]) => `<div class="px-5 py-4 sm:flex sm:gap-6"><dt class="font-semibold text-fg sm:w-40 shrink-0">${a}</dt><dd class="mt-0.5 sm:mt-0 text-[15px] text-fg2 leading-relaxed">${b}</dd></div>`).join('')}</dl>`;
      const sub = t => `<h3 class="mt-10 first:mt-0 mb-4 text-base font-semibold text-fg">${t}</h3>`;

      // ---- 의미 ----
      const meaningBody = `<div class="space-y-5 text-[17px] text-fg2 leading-[1.85]">${r.meaning.map(t => `<p>${t}</p>`).join('')}</div>`
        + (YW.devOpt('guideDeco') === 'rich' && isCharm ? anatomyHtml() : '');

      // 부적 해부도: 그림 오른쪽 가장자리에 번호, 옆에 번호별 설명
      function anatomyHtml() {
        const A = D.CHARM_ANATOMY;
        return `
        <figure class="mt-10 rounded-[2rem] bg-deep/70 ring-1 ring-edge/5 p-6 md:p-8">
          <figcaption class="text-base font-semibold text-fg">부적 한 장은 이렇게 이루어집니다</figcaption>
          <div class="mt-6 grid grid-cols-1 sm:grid-cols-[12rem_1fr] gap-8 sm:gap-10 items-center">
            <div class="relative w-44 sm:w-full mx-auto sm:mx-0 mr-10 sm:mr-0">
              <div class="shadow-[0_25px_50px_-20px_var(--drop)] rounded-[1rem] -rotate-1">${charmSVG(D.CHARM_TYPES.pyeongan, 7, r.by[0]?.hanja)}</div>
              ${A.map((a, i) => `<span class="absolute flex items-center -translate-y-1/2" style="top:${a.y}%; left:72%">
                <span class="w-[calc(28%+0.75rem)] min-w-[2.5rem] h-px bg-cinnabar/70"></span>
                <span class="w-6 h-6 shrink-0 rounded-full bg-cinnabar text-white text-xs font-bold flex items-center justify-center tabular-nums shadow">${i + 1}</span>
              </span>`).join('')}
            </div>
            <ol class="space-y-5">
              ${A.map((a, i) => `<li class="flex gap-3">
                <span class="w-6 h-6 shrink-0 rounded-full bg-cinnabar/15 text-cinnabar text-xs font-bold flex items-center justify-center tabular-nums mt-0.5">${i + 1}</span>
                <p class="text-[15px] text-fg2 leading-relaxed"><b class="text-fg">${a.name}</b> · ${a.text}</p>
              </li>`).join('')}
            </ol>
          </div>
        </figure>`;
      }

      // ---- 부적 종류 / 모시는 방식 ----
      let waysBody;
      if (isCharm) {
        const ids = [...new Set(r.by.flatMap(m => m.charms.map(c => c.id)))];
        waysBody = `<div class="rounded-2xl ring-1 ring-edge/10 divide-y divide-edge/10">${ids.map(id => {
            const c = D.CHARM_TYPES[id];
            const sellers = r.by.filter(m => m.charms.some(x => x.id === id));
            const href = sellers.length === 1 ? YW.charmUrl(sellers[0].id, id) : '#g-monks';
            return `<a href="${href}" class="group flex items-start gap-4 px-5 py-4 ease-spring hover:bg-edge/[0.03]">
              <span class="w-10 shrink-0 rounded-md overflow-hidden mt-0.5">${sellers.length === 1 ? YW.charmArt(sellers[0], id) : charmSVG(c, YW.hash('ritual', id) % 997 + 1)}</span>
              <span class="flex-1 min-w-0"><span class="font-semibold">${c.name}</span><span class="block mt-1 text-[15px] text-fg2 leading-relaxed">${c.desc}</span></span>
              <iconify-icon icon="solar:alt-arrow-right-linear" width="16" class="text-subtle mt-1 ease-spring group-hover:translate-x-0.5"></iconify-icon>
            </a>`;
          }).join('')}</div>`
          + sub('만드는 방식') + defs(D.MATERIALS.map(m => [m.name, m.note]));
      } else {
        waysBody = sub('함께 모시는 것') + checks(r.includes)
          + sub('참여 방식') + defs(r.modes.map(k => [D.MODES[k].name, D.MODES[k].note]))
          + (r.tiers ? sub(r.tierLabel) + defs(r.tiers.map(t => [t.name, t.note])) : '');
      }
      waysBody += `<p class="mt-8 text-sm text-subtle leading-relaxed">비용은 스님마다 다르며, ${single ? `<a href="${monkHref}" class="underline underline-offset-2 hover:text-fg">스님 페이지</a>` : '스님 페이지'}에서 미리 확인하실 수 있습니다.</p>`;

      // ---- 준비 ----
      const prepareBody = (isCharm ? sub('주문하실 때 알려 주세요') : '') + checks(r.prepare, 'solar:pen-linear')
        + (r.care ? sub('받으신 뒤에는 이렇게 두세요') + checks(r.care, 'solar:shield-check-linear')
          : `<div class="mt-8 rounded-2xl bg-edge/[0.03] ring-1 ring-edge/10 p-5 flex gap-3">
              <iconify-icon icon="solar:calendar-mark-linear" width="22" class="text-cinnabar shrink-0 mt-0.5"></iconify-icon>
              <p class="text-[15px] text-fg2 leading-relaxed"><b class="text-fg">날짜는 3일 전까지 잡아 주세요.</b> 제수와 위패를 준비하는 데 시간이 걸립니다. 예약하시면 스님이 직접 확인 전화를 드리고, 봉행 3일 전까지는 날짜를 바꾸실 수 있습니다.</p>
            </div>`);

      // ---- 스님 ----
      const chip = t => `<span class="rounded-full px-2.5 py-0.5 text-xs bg-edge/5 ring-1 ring-edge/10 text-fg2">${t}</span>`;
      const wayOf = m => (m.services.find(x => x.id === r.key) || {}).way?.[0];
      const monksBody = r.active ? (single ? '' : `<p class="-mt-2 mb-5 text-[15px] text-muted leading-relaxed">기본 절차는 같고, 스님마다 모시는 방식이 조금씩 다릅니다. 가까운 사찰이나 마음이 가는 스님을 골라 주세요.</p>`)
        + `<div class="rounded-2xl ring-1 ring-edge/10 divide-y divide-edge/10">${r.by.map(m => `
          <a href="${monkUrl(m.id)}" class="group flex items-center gap-4 p-5 ease-spring hover:bg-edge/[0.03]">
            ${monkAvatar(m, 'w-14 h-14 text-lg')}
            <div class="flex-1 min-w-0">
              <p class="font-bold flex items-center gap-1">${m.name} 스님<iconify-icon icon="solar:verified-check-linear" width="16" class="text-cinnabar"></iconify-icon></p>
              <p class="text-sm text-subtle">${m.temple}</p>
              <p class="mt-1.5 text-[15px] text-fg2 leading-relaxed">“${m.tagline}”</p>
              ${!single ? `<div class="mt-3 flex flex-wrap gap-1.5">${chip(`<iconify-icon icon="solar:map-point-linear" width="12" class="align-[-1px]"></iconify-icon> ${m.area}`)}${chip(`출가 ${m.years}년`)}</div>` : ''}
              ${!single && wayOf(m) ? `<p class="mt-2 text-sm text-muted leading-relaxed">${wayOf(m)}</p>` : ''}
            </div>
            <iconify-icon icon="solar:alt-arrow-right-linear" width="18" class="text-subtle shrink-0 ease-spring group-hover:translate-x-0.5"></iconify-icon>
          </a>`).join('')}</div>`
        : `<div class="rounded-2xl border border-dashed border-edge/15 p-8 text-center"><p class="font-semibold">이 의식을 모실 스님을 찾고 있습니다</p><button data-notify class="ease-spring mt-4 h-11 px-5 rounded-full bg-edge/5 border border-edge/10 text-sm font-semibold hover:bg-edge/10">예약 열리면 알림 받기</button></div>`;

      // ---- 진행 순서 ----

      $('#page').innerHTML = `

        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-24 grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_20rem] gap-12 xl:gap-16">
          <article class="min-w-0 max-w-[44rem]">
            ${sec('g-meaning', `${r.name}의 의미`, meaningBody)}

            ${quoteBlock}
            ${sec('g-steps', sections[2][1], stepsBody, isCharm ? '' : '세부 절차와 용어는 사찰마다 조금씩 다를 수 있습니다. 예약하시면 스님이 직접 설명해 드립니다.')}
            ${sec('g-ways', sections[3][1], waysBody)}
            ${sec('g-prepare', sections[4][1], prepareBody)}
            ${sec('g-monks', r.active ? `${r.name}을 모시는 스님` : '모시는 스님', monksBody)}
            ${sec('g-faq', '자주 묻는 질문', `<div id="gFaq" class="border-y border-edge/10 divide-y divide-edge/10"></div><a href="help.html" class="ease-spring mt-5 inline-flex items-center gap-1 text-sm text-cinnabar-soft hover:gap-2">고객센터에서 더 보기<iconify-icon icon="solar:arrow-right-linear" width="14"></iconify-icon></a>`)}

            <div class="mt-5 flex flex-wrap gap-2">
              ${YW.visibleRituals().filter(x => x.key !== r.key).map(x => `<a href="${YW.ritualUrl(x.key)}" class="ease-spring inline-flex items-center gap-2 h-11 pl-3 pr-4 rounded-full ring-1 ring-edge/10 bg-surface hover:ring-cinnabar/50 ${x.active ? '' : 'opacity-60'}"><span class="font-serif font-extrabold text-cinnabar-soft">${x.mark}</span><span class="text-[15px] font-medium">${x.name}</span></a>`).join('')}

           <a href="${monkHref}" class="flex-1 h-12 rounded-full bg-edge/5 text-sm font-semibold flex items-center justify-center gap-2 active:scale-[0.98] ease-spring">스님 만나보기</a>`
        : `<button data-notify class="flex-1 h-12 rounded-full bg-edge/5 text-sm font-semibold flex items-center justify-center gap-2"><iconify-icon icon="solar:bell-linear" width="18"></iconify-icon>예약 열리면 알림 받기</button>`;
      document.addEventListener('click', e => { if (e.target.closest('[data-notify]')) YW.toast('시안에서는 알림 신청이 저장되지 않습니다'); });

      // 지금 읽는 섹션을 탭에 표시
      const tabs = $$('#gTabs [data-tab]');
      const mark = id => tabs.forEach(t => {
        const on = t.dataset.tab === id;
        t.setAttribute('aria-current', on);
        // 모바일에서 탭 줄이 넘치면 지금 탭이 보이게 가로로만 밀어 줌
        if (on) t.parentElement.scrollTo({ left: t.offsetLeft - 16, behavior: 'smooth' });

      // 탭이 위에 붙으면 헤더와 탭 사이 틈을 막아 본문이 비치지 않게

    function render() {

      const pill = (href, label, icon, solid) => `

          ${label}
          <span class="ease-spring w-10 h-10 rounded-full ${solid ? 'bg-black/15' : 'bg-edge/5'} flex items-center justify-center group-hover:translate-x-1"><iconify-icon icon="${icon}" width="20"></iconify-icon></span>
        </a>`;
      if (r.active) {
        $('#rtCta').innerHTML = pill(primaryHref, single ? primaryLabel : `모시는 스님 ${r.by.length}분 보기`, 'solar:arrow-right-linear', true)

        $('#stickyInner').innerHTML = `
          <a href="${primaryHref}" class="flex-1 h-12 rounded-full bg-cinnabar text-white text-sm font-semibold flex items-center justify-center gap-2 active:scale-[0.98] ease-spring"><iconify-icon icon="solar:calendar-linear" width="18"></iconify-icon>${isCharm ? '부적 고르기' : '예약하기'}</a>
          <a href="#price" class="flex-1 h-12 rounded-full bg-edge/5 text-sm font-semibold flex items-center justify-center gap-2 active:scale-[0.98] ease-spring">${isCharm ? '종류 · 가격' : '비용 보기'}</a>`;
      } else {
        $('#rtCta').innerHTML = `
          <div class="rounded-2xl bg-edge/5 border border-edge/10 px-5 py-4 text-sm text-muted leading-relaxed max-w-md">

            모실 스님을 찾고 있습니다. 알림을 신청하시면 예약이 열릴 때 문자로 알려 드립니다.
          </div>
          <button data-notify class="ease-spring h-14 px-6 rounded-full bg-edge/5 border border-edge/10 font-semibold hover:bg-edge/10 flex items-center gap-2 w-max"><iconify-icon icon="solar:bell-linear" width="20"></iconify-icon>알림 신청</button>`;
        $('#stickyInner').innerHTML = `<button data-notify class="flex-1 h-12 rounded-full bg-edge/5 text-sm font-semibold flex items-center justify-center gap-2"><iconify-icon icon="solar:bell-linear" width="18"></iconify-icon>예약 열리면 알림 받기</button>`;
      }
      document.addEventListener('click', e => { if (e.target.closest('[data-notify]')) YW.toast('시안에서는 알림 신청이 저장되지 않습니다'); });

      const fact = (label, value) => `<div><dt class="text-xs text-subtle">${label}</dt><dd class="mt-1.5 font-bold tracking-tight leading-snug">${value}</dd></div>`;

        : r.min === r.max ? manwon(r.min) + (isCharm ? '부터' : '') : `${manwon(r.min)} – ${manwon(r.max)}`;
      const modeText = isCharm ? '등기 발송' : (r.modes || []).map(m => D.MODES[m].name).join(', ');
      $('#rtFacts').innerHTML = [
        fact(isCharm ? '받아 보시는 때' : '소요 시간', r.dur),
        fact(isCharm ? '보내는 방법' : '횟수', r.count),
        fact(isCharm ? '가격' : '비용', `<span class="text-cinnabar">${priceText}</span>`),
        fact('모시는 스님', r.active ? `${r.by.length}분` : '없음'),
        `<div class="col-span-2 pt-5 border-t border-edge/10"><dt class="text-xs text-subtle">${isCharm ? '제작 방식' : '참여 방식'}</dt><dd class="mt-1.5 text-sm text-fg2 leading-relaxed">${isCharm ? D.MATERIALS.map(m => m.name).join(' · ') : modeText}</dd></div>`,
      ].join('');

      // ---------- 이런 분께 ----------
      $('#rtForWhom').innerHTML = r.forWhom.map((t, i) => `

        $('#rtPriceEyebrow').textContent = '種 · 종류와 가격';

        // 스님들이 쓰는 부적 종류를 모아 최저가 표시
        const types = {};
        r.by.forEach(m => m.charms.forEach(c => { types[c.id] = Math.min(types[c.id] ?? Infinity, c.price); }));

          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-${Math.min(5, Math.max(3, Object.keys(types).length))} gap-4">
            ${Object.entries(types).map(([id, price], i) => {
              const c = D.CHARM_TYPES[id];
              // 이 부적을 쓰는 스님이 한 분이면 그 스님의 부적 상세로, 여러 분이면 스님 목록으로
              const sellers = r.by.filter(m => m.charms.some(x => x.id === id));
              const href = sellers.length === 1 ? YW.charmUrl(sellers[0].id, id) : '#monks';
              return `<a href="${href}" class="reveal group block rounded-[1.75rem] p-1.5 bg-edge/5 ring-1 ring-edge/10 ease-spring hover:ring-cinnabar/50" style="--index:${i}">
                <div class="h-full rounded-[calc(1.75rem-0.375rem)] bg-surface shadow-[inset_0_1px_1px_rgba(255,255,255,0.08)] p-5 flex flex-col items-center text-center">
                  <div class="w-20 ease-spring group-hover:-translate-y-1 shadow-[0_20px_40px_-18px_var(--drop)] rounded-[1rem]">${(sellers.length === 1 ? YW.charmArt(sellers[0], id) : charmSVG(c, YW.hash('ritual', id) % 997 + 1))}</div>
                  <p class="mt-4 text-xs text-cinnabar-soft">${c.cat}</p>
                  <p class="mt-0.5 font-bold">${c.name}</p>
                  <p class="mt-1 text-sm text-muted tabular-nums">${won(price)}부터</p>
                </div></a>`;
            }).join('')}
          </div>
          <div class="mt-10 grid grid-cols-1 md:grid-cols-3 gap-4">
            ${D.MATERIALS.map(m => card(`<p class="text-xs text-subtle">${m.add ? '+' + won(m.add) : '기본'}</p><p class="mt-1 text-lg font-bold tracking-tight">${m.name}</p><p class="mt-2 text-sm text-muted">${m.note}</p>`)).join('')}
          </div>`;
      } else {
        $('#rtPriceEyebrow').textContent = '費 · 비용 안내';
        $('#rtPriceTitle').innerHTML = '비용에 포함된 것과<br>고르실 수 있는 것';
        const rows = r.by.map(m => `<tr class="border-t border-edge/10"><td class="py-3 pr-4"><a href="${YW.bookUrl(m, r.key)}" class="ease-spring hover:text-cinnabar-soft">${m.name} 스님 <span class="text-subtle">· ${m.temple}</span></a></td><td class="py-3 text-right font-semibold tabular-nums">${won(YW.priceAt(m, r.key))}</td></tr>`).join('');
        $('#rtPrice').innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 lg:gap-5">
            ${card(`<p class="font-bold text-lg tracking-tight flex items-center gap-2"><iconify-icon icon="solar:check-circle-bold" width="20" class="text-cinnabar"></iconify-icon>기본 포함</p>
              <ul class="mt-4 space-y-2 text-sm text-fg2">${r.includes.map(t => `<li class="flex gap-2"><span class="text-cinnabar">·</span>${t}</li>`).join('')}</ul>`)}
            ${card(r.tiers ? `<p class="font-bold text-lg tracking-tight flex items-center gap-2"><iconify-icon icon="solar:hand-heart-linear" width="20" class="text-cinnabar"></iconify-icon>${r.tierLabel}</p>
              <ul class="mt-4 space-y-3 text-sm">${r.tiers.map(t => `<li class="flex justify-between gap-3"><span><b class="text-fg">${t.name}</b> <span class="text-subtle">${t.note}</span></span><span class="tabular-nums shrink-0 text-fg2">${t.add ? '+' + won(t.add) : '포함'}</span></li>`).join('')}</ul>`
              : `<p class="font-bold text-lg tracking-tight flex items-center gap-2"><iconify-icon icon="solar:videocamera-record-linear" width="20" class="text-cinnabar"></iconify-icon>참여 방식</p>
              <ul class="mt-4 space-y-3 text-sm">${r.modes.map(k => `<li class="flex justify-between gap-3"><span><b class="text-fg">${D.MODES[k].name}</b> <span class="text-subtle">${D.MODES[k].note}</span></span><span class="tabular-nums shrink-0 text-fg2">${D.MODES[k].add ? '+' + won(D.MODES[k].add) : '추가 비용 없음'}</span></li>`).join('')}</ul>`)}
            ${card(`<p class="font-bold text-lg tracking-tight flex items-center gap-2"><iconify-icon icon="solar:wallet-linear" width="20" class="text-cinnabar"></iconify-icon>스님별 기본 비용</p>
              ${r.active ? `<table class="mt-3 w-full text-sm"><tbody>${rows}</tbody></table>` : '<p class="mt-4 text-sm text-subtle">모실 스님이 정해지면 비용을 안내해 드립니다.</p>'}
              <p class="mt-4 text-xs text-subtle leading-relaxed">취소 · 환불은 <a href="help.html#refund" class="underline underline-offset-2 hover:text-fg">환불 규정</a>을 따릅니다.</p>`)}
          </div>`;
      }

      // ---------- 준비하실 것 (+ 부적은 보관법) ----------
      const listCard = (eyebrow, title, items, icon) => card(`
        <span class="inline-block rounded-full px-3 py-1 text-[11px] tracking-[0.15em] font-medium bg-cinnabar/10 text-cinnabar-soft">${eyebrow}</span>
        <h2 class="mt-5 text-2xl md:text-3xl font-bold tracking-tight">${title}</h2>
        <ul class="mt-6 space-y-3">${items.map(t => `<li class="flex gap-3 leading-relaxed text-fg2"><iconify-icon icon="${icon}" width="20" class="text-cinnabar shrink-0 mt-0.5"></iconify-icon>${t}</li>`).join('')}</ul>`);
      $('#rtPrepareWrap').innerHTML = listCard('備 · 준비하실 것', '예약하실 때<br>알려 주세요', r.prepare, 'solar:pen-linear')
        + (r.care ? listCard('守 · 보관과 처리', '받으신 뒤에는<br>이렇게 두세요', r.care, 'solar:shield-check-linear')
          : card(`<span class="inline-block rounded-full px-3 py-1 text-[11px] tracking-[0.15em] font-medium bg-cinnabar/10 text-cinnabar-soft">約 · 예약 전 확인</span>
              <h2 class="mt-5 text-2xl md:text-3xl font-bold tracking-tight">날짜는<br>3일 전까지 잡아 주세요</h2>
              <p class="mt-6 text-muted leading-relaxed">제수와 위패를 준비하는 데 시간이 걸립니다. 예약하시면 스님이 직접 확인 전화를 드리고, 봉행 3일 전까지는 날짜를 무료로 바꿀 수 있습니다.</p>`));
      $('#rtPrepareWrap').firstElementChild.style.setProperty('--index', 0);

      // ---------- 모시는 스님 ----------
      $('#rtMonkTitle').innerHTML = r.active ? `${r.name}을 모시는 스님` : '모실 스님을 찾고 있습니다';
      $('#rtMonks').className = 'mt-12 grid gap-5 ' + (r.by.length >= 2 ? 'grid-cols-1 md:grid-cols-2 lg:grid-cols-3' : 'grid-cols-1');
      $('#rtMonks').innerHTML = r.active ? r.by.map((m, i) => `
        <a href="${YW.bookUrl(m, r.key)}" class="reveal group block rounded-[2rem] p-1.5 bg-edge/5 ring-1 ring-edge/10 ease-spring hover:ring-edge/25" style="--index:${i}">
          <article class="h-full rounded-[calc(2rem-0.375rem)] bg-surface shadow-[inset_0_1px_1px_rgba(255,255,255,0.08)] overflow-hidden grid grid-cols-1 ${r.by.length === 1 ? 'md:grid-cols-[18rem_1fr]' : ''}">
            <div class="relative h-40 ${r.by.length === 1 ? 'md:h-auto' : ''} overflow-hidden">
              <div class="absolute inset-0 ease-spring group-hover:scale-105">${YW.monkCover(m)}</div>
              <div class="absolute inset-0 flex items-center justify-center">${monkAvatar(m, 'w-20 h-20 text-xl ring-4 ring-surface/80')}</div>
            </div>
            <div class="p-6 md:p-8 flex flex-col">
              <h3 class="text-xl font-bold tracking-tight flex items-center gap-1.5">${m.name} 스님 <iconify-icon icon="solar:verified-check-linear" width="18" class="text-cinnabar"></iconify-icon></h3>
              <p class="text-sm text-subtle mt-0.5">${m.temple} · ${m.area} · 출가 ${m.years}년</p>
              <p class="mt-4 text-fg2 leading-relaxed">“${m.tagline}”</p>
              <div class="mt-6 pt-5 border-t border-edge/5 flex flex-wrap items-center justify-between gap-4">
                <span class="yw-review text-sm flex items-center gap-1.5"><span class="flex text-cinnabar">${stars(m.rating, 13)}</span><b>${m.rating}</b><span class="text-subtle">(${m.reviewCount.toLocaleString('ko-KR')})</span></span>
                <span class="ease-spring inline-flex items-center gap-2 rounded-full bg-cinnabar text-white pl-5 pr-1.5 py-1.5 text-sm font-semibold group-hover:scale-[1.03]">${won(YW.priceAt(m, r.key))}${isCharm ? '부터' : ''} · ${isCharm ? '주문하기' : '예약하기'}<span class="w-8 h-8 rounded-full bg-black/15 flex items-center justify-center group-hover:translate-x-0.5 ease-spring"><iconify-icon icon="solar:arrow-right-linear" width="16"></iconify-icon></span></span>
              </div>
            </div>
          </article>
        </a>`).join('') : `
        <div class="rounded-[2rem] border border-dashed border-edge/15 py-16 text-center">
          <span class="font-serif text-5xl font-extrabold text-edge/10">${r.mark}</span>
          <p class="mt-5 font-semibold">이 의식을 모실 스님을 모시는 중입니다</p>
          <button data-notify class="ease-spring mt-6 h-11 px-5 rounded-full bg-edge/5 border border-edge/10 text-sm font-semibold hover:bg-edge/10">예약 열리면 알림 받기</button>
        </div>`;

      // ---------- 질문 ----------
      $('#rtFaqTitle').innerHTML = `${r.name}에 대해<br>많이 물으십니다`;
      YW.renderFaq($('#rtFaq'), r.faq);

      // ---------- 다른 의식 ----------
      $('#rtOthers').innerHTML = YW.visibleRituals().filter(x => x.key !== r.key).map((x, i) => `
        <a href="${YW.ritualUrl(x.key)}" class="reveal group snap-start shrink-0 w-64 rounded-[1.75rem] p-1.5 bg-edge/5 ring-1 ring-edge/10 ease-spring hover:ring-cinnabar/50" style="--index:${i}">
          <div class="${x.active ? '' : 'opacity-70'} h-full overflow-hidden rounded-[calc(1.75rem-0.375rem)] bg-surface shadow-[inset_0_1px_1px_rgba(255,255,255,0.08)]">
            <div class="relative h-32 overflow-hidden">
              ${YW.photo(YW.ritualImg(x.key), x.name, 'absolute inset-0 w-full h-full object-cover ease-spring group-hover:scale-105')}
              <span class="absolute inset-0 bg-gradient-to-t from-black/45 to-transparent"></span>
              <span class="absolute left-4 bottom-2 font-serif font-extrabold text-2xl text-white/90">${x.mark}</span>
              ${x.active ? '' : '<span class="absolute right-3 top-3 rounded-full px-2 py-0.5 text-[10px] bg-black/50 text-white">준비 중</span>'}
            </div>
            <div class="p-5">
            <p class="font-bold">${x.name}</p>
            <p class="mt-1 text-sm text-muted line-clamp-2">${x.summary}</p>
            <p class="mt-4 text-sm">${!x.active ? '<b>준비 중</b>' : YW.devOpt('cardPrice') === 'show' ? `<b class="tabular-nums">${manwon(x.min)}부터</b>` : `<span class="text-muted">${x.dur}</span>`}</p>
            </div>
          </div>
        </a>`).join('');

      YW.observeReveals();
      YW.stickyBar('#stickyBar', '#top');
    }
  </script>
</body>
</html>
